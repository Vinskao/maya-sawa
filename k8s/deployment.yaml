apiVersion: apps/v1
kind: Deployment
metadata:
  name: maya-sawa
  labels:
    app.kubernetes.io/name: maya-sawa
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: maya-sawa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maya-sawa
    spec:
      imagePullSecrets:
      - name: dockerhub-credentials
      # FRED HTTPS egress is available from this worker; the other worker times out.
      nodeSelector:
        kubernetes.io/hostname: 10.0.158.183
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - jenkins
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: maya-sawa
        image: papakao/maya-sawa:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: BLOG_ENABLED
          valueFrom:
            configMapKeyRef:
              name: blog-workflow-config
              key: BLOG_ENABLED
              optional: true
        - name: OPENAI_API_KEY
          value: "${OPENAI_API_KEY}"
        - name: OPENAI_ORGANIZATION
          value: "${OPENAI_ORGANIZATION}"
        - name: OPENAI_API_BASE
          value: "https://api.openai.com/v1"
        - name: DB_HOST
          value: "${DB_HOST}"
        - name: DB_PORT
          value: "${DB_PORT}"
        - name: DB_DATABASE
          value: "${DB_DATABASE}"
        - name: DB_USERNAME
          value: "${DB_USERNAME}"
        - name: DB_PASSWORD
          value: "${DB_PASSWORD}"
        - name: DB_SSLMODE
          value: "disable"
        # === Paprika / Git Commit Knowledge Database Configuration ===
        - name: PAPRIKA_DB_TYPE
          value: "postgresql"
        - name: PAPRIKA_DB_HOST
          value: "${DB_HOST}"
        - name: PAPRIKA_DB_PORT
          value: "${DB_PORT}"
        - name: PAPRIKA_DB_DATABASE
          value: "${DB_DATABASE}"
        - name: PAPRIKA_DB_USERNAME
          value: "${DB_USERNAME}"
        - name: PAPRIKA_DB_PASSWORD
          value: "${DB_PASSWORD}"
        - name: PAPRIKA_DB_SSLMODE
          value: "disable"
        # === Keycloak Resource Server Configuration ===
        - name: KEYCLOAK_AUTH_SERVER_URL
          value: "${KEYCLOAK_AUTH_SERVER_URL}"
        - name: KEYCLOAK_REALM
          value: "${PUBLIC_REALM}"
        - name: KEYCLOAK_CLIENT_ID
          value: "peoplesystem"
        - name: SECURITY_ENABLED
          value: "true"
        - name: SECURITY_TRUSTED_PROXY_CIDRS
          value: "127.0.0.1/32,10.244.1.0/24"
        - name: SECURITY_IP_ALLOWLIST_CIDRS
          value: "127.0.0.1/32,10.244.1.0/24"
        - name: SECURITY_IP_ALLOWLIST_PATHS
          value: "/git-commits/ingest,/otel/v1/metrics"
        - name: SECURITY_PUBLIC_RATE_LIMIT_PER_MINUTE
          value: "60"
        - name: SECURITY_AUTH_RATE_LIMIT_PER_MINUTE
          value: "180"
        - name: SECURITY_MAX_BODY_BYTES
          value: "2097152"
        - name: AI_RATE_LIMIT_MANAGER_PER_MINUTE
          value: "10"
        - name: AI_RATE_LIMIT_STANDARD_PER_MINUTE
          value: "1"
        - name: AI_RATE_LIMIT_ANONYMOUS_PER_MINUTE
          value: "1"
        - name: AI_RATE_LIMIT_WINDOW_SECONDS
          value: "60"
        - name: GIT_COMMIT_REQUIRED_ROLE
          value: "manage-users"
        # === People Database Configuration ===
        - name: PEOPLE_DB_HOST
          value: "${PEOPLE_DB_HOST}"
        - name: PEOPLE_DB_PORT
          value: "${PEOPLE_DB_PORT}"
        - name: PEOPLE_DB_DATABASE
          value: "${PEOPLE_DB_DATABASE}"
        - name: PEOPLE_DB_USERNAME
          value: "${PEOPLE_DB_USERNAME}"
        - name: PEOPLE_DB_PASSWORD
          value: "${PEOPLE_DB_PASSWORD}"
        - name: PEOPLE_DB_SSLMODE
          value: "disable"
        - name: REDIS_HOST
          value: "${REDIS_HOST}"
        - name: REDIS_CUSTOM_PORT
          value: "${REDIS_CUSTOM_PORT}"
        - name: REDIS_PASSWORD
          value: "${REDIS_PASSWORD}"
        - name: REDIS_QUEUE_MAYA
          value: "${REDIS_QUEUE_MAYA}"
        # === Voyeur Configuration (MONGODB_URI includes auth credentials) ===
        - name: MONGODB_URI
          value: "${MONGODB_URI}"
        - name: MONGODB_DB
          value: "voyeur"
        - name: MONGODB_COLLECTION
          value: "metrics"
        - name: REDIS_QUEUE_VOYEUR
          value: "voyeur_queue"
        - name: WEBSOCKET_TYMB
          value: ""  # 禁用 Metrics Consumer
        - name: WEBSOCKET_HOST
          value: ""  # 禁用 Metrics Consumer
        - name: WEBSOCKET_PORT
          value: "443"
        - name: WEBSOCKET_PATH
          value: "/tymb/metrics"
        - name: PUBLIC_API_BASE_URL
          value: "http://ty-multiverse-gateway-service:8082"
        - name: PUBLIC_TYMB_URL
          value: "http://ty-multiverse-backend/tymb"
        - name: AI_USAGE_INGEST_TOKEN
          value: "${AI_USAGE_INGEST_TOKEN}"
        # Fire tokens for the analysis routines (services/market_automation.py); absent until set in Jenkins.
        - name: MARKET_ROUTINE_TAIWAN_TOKEN
          valueFrom:
            secretKeyRef:
              name: market-routine-fire
              key: MARKET_ROUTINE_TAIWAN_TOKEN
              optional: true
        - name: MARKET_ROUTINE_US_TOKEN
          valueFrom:
            secretKeyRef:
              name: market-routine-fire
              key: MARKET_ROUTINE_US_TOKEN
              optional: true
        # SHA-256 of the scheduled analysis routine's write key (not the key itself); see docs/MARKET_AGENT_KEY.md
        - name: MARKET_AGENT_KEY_SHA256
          value: "7765262f9c8c415680a394cfb488f60cb9bbea9daf61ae707a28eb65173b75c7"
        - name: MARKET_INTERNAL_SECRET
          valueFrom:
            secretKeyRef:
              name: market-internal-secret
              key: MARKET_INTERNAL_SECRET
        - name: SHIOAJI_API_KEY
          valueFrom:
            secretKeyRef:
              name: shioaji-market
              key: SHIOAJI_API_KEY
        - name: SHIOAJI_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: shioaji-market
              key: SHIOAJI_SECRET_KEY
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-notify
              key: TELEGRAM_BOT_TOKEN
              optional: true
        - name: TELEGRAM_CHAT_ID
          valueFrom:
            secretKeyRef:
              name: telegram-notify
              key: TELEGRAM_CHAT_ID
              optional: true
        - name: BLS_API_KEY
          valueFrom:
            secretKeyRef:
              name: macro-data-credentials
              key: BLS_API_KEY
              optional: true
        - name: FRED_API_KEY
          valueFrom:
            secretKeyRef:
              name: macro-data-credentials
              key: FRED_API_KEY
              optional: true
        - name: OPENDART_API_KEY
          valueFrom:
            secretKeyRef:
              name: filings-credentials
              key: OPENDART_API_KEY
              optional: true
        - name: JQUANTS_API_KEY
          valueFrom:
            secretKeyRef:
              name: jquants-credentials
              key: JQUANTS_API_KEY
              optional: true
        - name: BINANCE_API_KEY
          valueFrom:
            secretKeyRef:
              name: binance-credentials
              key: BINANCE_API_KEY
              optional: true
        - name: BINANCE_API_SECRET
          valueFrom:
            secretKeyRef:
              name: binance-credentials
              key: BINANCE_API_SECRET
              optional: true
        - name: EDINET_API_KEY
          valueFrom:
            secretKeyRef:
              name: edinet-credentials
              key: EDINET_API_KEY
              optional: true
        - name: MACRO_ENABLED
          value: "${MACRO_ENABLED}"
        - name: MACRO_BLS_DAILY_BUDGET
          value: "40"
        - name: MACRO_FRED_DAILY_BUDGET
          value: "200"
        - name: SHIOAJI_SIMULATION
          value: "false"
        - name: SHIOAJI_PORTFOLIO_ENABLED
          value: "true"
        - name: SHIOAJI_QUOTE_CACHE_SECONDS
          value: "60"
        - name: SHIOAJI_PORTFOLIO_CACHE_SECONDS
          value: "3600"
        - name: FINMIND_TOKEN
          valueFrom:
            secretKeyRef:
              name: finmind-market
              key: FINMIND_TOKEN
              optional: true
        # === IBKR Client Portal API (in-cluster gateway) ===
        - name: IBKR_ENABLED
          value: "true"
        - name: IBKR_GATEWAY_URL
          value: "https://ibkr-gw:5000"
        # Refresh every 4 min: also keeps the gateway session alive (idle ~6 min)
        - name: IBKR_REFRESH_SECONDS
          value: "240"
        # Vector search tuning
        - name: MATCH_COUNT
          value: "5"
        - name: SIMILARITY_THRESHOLD
          value: "0.7"
        # Embedding validation/tuning
        - name: FORCE_LOCAL_EMBEDDING
          value: "true"
        - name: VALIDATE_UPSTREAM_EMBEDDING
          value: "true"
        # === Auto-sync feature flags (enabled in production) ===
        - name: ENABLE_PEOPLE_WEAPONS_SYNC
          value: "true"
        # Article pull from the retired Laravel paprika (gateway /paprika/articles, no route since the migration):
        # articles live in maya-sawa now and the frontend pushes them, so both article syncs stay off.
        - name: ENABLE_AUTO_SYNC_ON_STARTUP
          value: "false"
        - name: ENABLE_PEOPLE_WEAPONS_PERIODIC_SYNC
          value: "true"
        - name: ENABLE_PERIODIC_SYNC
          value: "false"
        # 影片合成的暫存目錄，必須指向下方掛載的 emptyDir，
        # 否則會寫進 container 可寫層（不受 volume 管理、也不會被清掉）
        - name: TEMP_DIR
          value: "/app/temp"
        resources:
          requests:
            memory: "768Mi"
            cpu: "10m"
          limits:
            # 實測：4 支 1080p 影片 hstack 成 7680x1080 時 ffmpeg 峰值約 1.6GB，
            # 原本的 1536Mi 會直接被 OOMKill
            memory: "3Gi"
            cpu: "1000m"
        volumeMounts:
        - name: temp-storage
          mountPath: /app/temp
        startupProbe:
          httpGet:
            path: /paprika/articles  # 使用一個輕量級的 GET 端點
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /paprika/articles
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /paprika/articles
            port: 8000
          initialDelaySeconds: 45
          periodSeconds: 10
      volumes:
      - name: temp-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: maya-sawa
  labels:
    app.kubernetes.io/name: maya-sawa
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: maya-sawa
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maya-sawa-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Live 影片合成會一次上傳最多 4 支影片，50m 太小會回 413
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
    # 大檔改用串流轉發，不要在 nginx 先整包緩衝
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    cert-manager.io/cluster-issuer: letsencrypt-production
    cert-manager.io/certificate-name: peoplesystem-tls
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - peoplesystem.tatdvsonorth.com
    secretName: peoplesystem-tls
  rules:
  - host: peoplesystem.tatdvsonorth.com
    http:
      paths:
      - path: /maya-sawa/
        pathType: Prefix
        backend:
          service:
            name: maya-sawa
            port:
              number: 80
      - path: /maya-v2/
        pathType: Prefix
        backend:
          service:
            name: maya-sawa
            port:
              number: 80
      - path: /voyeur/
        pathType: Prefix
        backend:
          service:
            name: maya-sawa
            port:
              number: 80
      - path: /paprika/
        pathType: Prefix
        backend:
          service:
            name: maya-sawa
            port:
              number: 80
